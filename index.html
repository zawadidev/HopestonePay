<script>
async function sendMoney() {
  const response = await fetch("/send-money", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ sender: "user1", receiver: "user2", amount: 100 })
  });
  const result = await response.json();
  console.log(result);
}

async function withdrawSavings() {
  const response = await fetch("/withdraw-savings", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ user: "user1" })
  });
  const result = await response.json();
  console.log(result);
}
</script>
