<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HopestonePay</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        h2 {
            margin-top: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 95%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #4facfe;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        button:hover {
            background: #007bff;
        }

        .result {
            margin-top: 10px;
            font-size: 14px;
            color: green;
        }

        .error {
            color: red;
        }

        hr {
            margin: 20px 0;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>HopestonePay</h1>

    <h2>Register</h2>
    <input type="text" id="reg_username" placeholder="Username">
    <input type="password" id="reg_password" placeholder="Password">
    <button onclick="register()">Register</button>
    <p id="reg_result" class="result"></p>

    <hr>

    <h2>Login</h2>
    <input type="text" id="login_username" placeholder="Username">
    <input type="password" id="login_password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="login_result" class="result"></p>
</div>

<script>
const BASE_URL = "https://hopestonepay.onrender.com";

// Register
function register() {
    const username = document.getElementById("reg_username").value;
    const password = document.getElementById("reg_password").value;

    fetch(BASE_URL + "/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ username, password })
    })
    .then(res => res.json())
    .then(data => {
        const el = document.getElementById("reg_result");
        el.innerText = data.message || data.error;
        el.className = data.error ? "result error" : "result";
    });
}

// Login
function login() {
    const username = document.getElementById("login_username").value;
    const password = document.getElementById("login_password").value;

    fetch(BASE_URL + "/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ username, password })
    })
    .then(res => res.json())
    .then(data => {
        const el = document.getElementById("login_result");
        el.innerText = data.message || data.error;
        el.className = data.error ? "result error" : "result";
    });
}
</script>

</body>
</html>
