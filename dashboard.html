<!DOCTYPE html>
<html>
<head>
  <title>HopestonePay 💰 - Login/Register</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="text-center mb-4">HopestonePay 💰</h2>

    <!-- Register Form -->
    <div class="card mb-4">
      <div class="card-body">
        <h4>Register</h4>
        <input id="reg-phone" class="form-control mb-2" placeholder="Phone">
        <input id="reg-name" class="form-control mb-2" placeholder="Name">
        <input id="reg-email" class="form-control mb-2" placeholder="Email">
        <input id="reg-password" class="form-control mb-2" type="password" placeholder="Password">
        <button id="register-btn" class="btn btn-primary">Register</button>
      </div>
    </div>

    <!-- Login Form -->
    <div class="card">
      <div class="card-body">
        <h4>Login</h4>
        <input id="login-phone" class="form-control mb-2" placeholder="Phone">
        <input id="login-password" class="form-control mb-2" type="password" placeholder="Password">
        <button id="login-btn" class="btn btn-success">Login</button>
      </div>
    </div>
  </div>

  <script>
    const apiBase = "https://zawadiipay.onrender.com"; // Replace with your Render backend URL

    document.getElementById("register-btn").addEventListener("click", async () => {
      const response = await fetch(apiBase + "/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          phone: document.getElementById("reg-phone").value,
          name: document.getElementById("reg-name").value,
          email: document.getElementById("reg-email").value,
          password: document.getElementById("reg-password").value
        })
      });
      const result = await response.json();
      alert(result.message);
    });

    document.getElementById("login-btn").addEventListener("click", async () => {
      const response = await fetch(apiBase + "/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          phone: document.getElementById("login-phone").value,
          password: document.getElementById("login-password").value
        })
      });
      const result = await response.json();
      if (result.message === "Login successful") {
        alert("Welcome " + document.getElementById("login-phone").value);
        window.location.href = "dashboard.html";
      } else {
        alert(result.message);
      }
    });
  </script>
</body>
</html>
