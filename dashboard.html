<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>

<h1>HopestonePay Dashboard</h1>

<p id="info"></p>

<h3>Balance: <span id="balance"></span></h3>
<h3>Savings: <span id="savings"></span></h3>
<h3>Points: <span id="points"></span></h3>

<hr>

<input id="amount" placeholder="Amount">
<input id="user2" placeholder="User (for send)">

<br><br>

<button onclick="deposit()">Deposit</button>
<button onclick="send()">Send</button>
<button onclick="withdraw()">Withdraw</button>
<button onclick="airtime()">Airtime</button>
<button onclick="save()">Save</button>
<button onclick="withdrawSavings()">Withdraw Savings</button>

<hr>

<h3>Transactions</h3>
<ul id="tx"></ul>

<button onclick="logout()">Logout</button>

<script>
const API = "https://hopestonepay.onrender.com";
const username = localStorage.getItem("username");

document.getElementById("info").innerText = "User: " + username;

function load() {
    fetch(API + "/dashboard/" + username)
    .then(res => res.json())
    .then(data => {
        document.getElementById("balance").innerText = data.balance;
        document.getElementById("savings").innerText = data.savings;
        document.getElementById("points").innerText = data.points;

        let tx = "";
        data.transactions.forEach(t => {
            tx += "<li>" + t + "</li>";
        });
        document.getElementById("tx").innerHTML = tx;
    });
}

function deposit() {
    action("/deposit", {username, amount: amount.value});
}

function send() {
    action("/send", {from: username, to: user2.value, amount: amount.value});
}

function withdraw() {
    action("/withdraw", {username, amount: amount.value});
}

function airtime() {
    action("/airtime", {username, amount: amount.value});
}

function save() {
    action("/save", {username, amount: amount.value});
}

function withdrawSavings() {
    action("/withdraw_savings", {username});
}

function action(url, body) {
    fetch(API + url, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message || data.error);
        load();
    });
}

function logout() {
    localStorage.clear();
    window.location.href = "index.html";
}

load();
</script>

</body>
</html>
