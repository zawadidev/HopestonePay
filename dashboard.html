<!DOCTYPE html>
<html>
<head>
  <title>HopestonePay 💰</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container mt-4">
    <h2 class="text-center mb-4">HopestonePay 💰</h2>

    <!-- Balances -->
    <div class="card mb-3">
      <div class="card-body">
        <h5>Main Balance: <span id="balance">Loading...</span></h5>
        <h6>Savings Wallet: <span id="savings">Loading...</span></h6>
        <h6>Points: <span id="points">Loading...</span></h6>
        <div class="progress mt-2">
          <div id="progress-bar" class="progress-bar bg-success"></div>
        </div>
        <p id="progress-text" class="mt-2"></p>
        <button id="withdraw-savings-btn" class="btn btn-primary mt-2" disabled>Withdraw Savings</button>
      </div>
    </div>

    <!-- Deposit -->
    <div class="card mb-3">
      <div class="card-body">
        <h5>Deposit</h5>
        <input id="deposit-amount" class="form-control mb-2" placeholder="Amount (KSh)" type="number">
        <button id="deposit-btn" class="btn btn-primary">Deposit</button>
      </div>
    </div>

    <!-- Send Money -->
    <div class="card mb-3">
      <div class="card-body">
        <h5>Send Money</h5>
        <input id="receiver" class="form-control mb-2" placeholder="Receiver Phone">
        <input id="send-amount" class="form-control mb-2" placeholder="Amount (KSh)" type="number">
        <button id="send-btn" class="btn btn-success">Send</button>
      </div>
    </div>

    <!-- Withdraw -->
    <div class="card mb-3">
      <div class="card-body">
        <h5>Withdraw</h5>
        <input id="withdraw-amount" class="form-control mb-2" placeholder="Amount (KSh)" type="number">
        <button id="withdraw-btn" class="btn btn-danger">Withdraw</button>
      </div>
    </div>

    <!-- Airtime -->
    <div class="card mb-3">
      <div class="card-body">
        <h5>Buy Airtime</h5>
        <input id="airtime-amount" class="form-control mb-2" placeholder="Amount (KSh)" type="number">
        <button id="airtime-btn" class="btn btn-warning">Buy Airtime</button>
      </div>
    </div>

    <!-- Transaction History -->
    <div class="card mb-3">
      <div class="card-body">
        <h5>Transaction History</h5>
        <ul id="transactions-list" class="list-group"></ul>
      </div>
    </div>
  </div>

      });
